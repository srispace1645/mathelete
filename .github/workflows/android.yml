name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.MATHELETE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check every question and answer
        run: ./gradlew :core:test --console=plain

      - name: Build the Android app
        # The release build here is unsigned; it checks the release version compiles and passes lint.
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: mathelete-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Test the TV remote controls and take screenshots
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      # Replaces the ci-screenshots branch with this build's pictures so they can be viewed without downloading.
      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$SHOTS"
          cp app/build/outputs/roborazzi/*.png "$SHOTS"/
          cd "$SHOTS"
          echo "Screenshots from commit ${GITHUB_SHA}. This branch is replaced on every build." > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      # Publishing: on a push to main, build the APK signed with the owner's key and post it on the
      # Releases page, once per versionName. The key lives only in the repo's Actions secrets.
      - name: Note that publishing is skipped
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY != 'true'
        run: echo "::notice::No signing key in the repo secrets yet, so no release was published. See README, 'Publishing a new version'."

      - name: Build the signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          MATHELETE_KEYSTORE: ${{ secrets.MATHELETE_KEYSTORE }}
          MATHELETE_KEYSTORE_PASSWORD: ${{ secrets.MATHELETE_KEYSTORE_PASSWORD }}
          MATHELETE_KEY_ALIAS: ${{ secrets.MATHELETE_KEY_ALIAS }}
          MATHELETE_KEY_PASSWORD: ${{ secrets.MATHELETE_KEY_PASSWORD }}
        run: |
          set -e
          export MATHELETE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$MATHELETE_KEYSTORE" | tr -d ' \r\n' | base64 --decode > "$MATHELETE_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease --console=plain
          rm -f "$MATHELETE_KEYSTORE_FILE"
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then echo "::error::No signed APK was made. Check the 4 MATHELETE_* secrets."; exit 1; fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "$RUNNER_TEMP/mathelete.apk"

      - name: Publish the release on GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Raise versionCode and versionName in app/build.gradle.kts to publish a new one."
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Download **mathelete.apk** below.

          - **Phone or tablet:** open the file and tap **Install**. If Android asks, allow installs from your browser or Files app.
          - **Fire TV:** follow "Install on a Fire TV" in the [README](https://github.com/srispace1645/mathelete#install-on-a-fire-tv-from-a-windows-laptop).

          Needs Android 5.1 or newer. Works offline, with no ads and no accounts.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/mathelete.apk" --target "$GITHUB_SHA" --title "Mathelete $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
